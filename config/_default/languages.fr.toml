[params.disclaimer]
showIcon = false
cardColor = "#f2f2f2"
text = '''
**Développement d’applications mobiles comme support d’apprentissage**
<br><br>
Dans le cadre de leur formation en Informatique et Systèmes de Communication (ISC), les étudiants développent des applications mobiles complètes en utilisant des technologies modernes telles que **Kotlin (Android natif), Flutter**, ainsi que les capteurs natifs des smartphones (**gyroscope, caméra, Bluetooth**).
<br><br>
Les projets couvrent différents domaines : jeux interactifs, applications de santé, systèmes de communication, traitement de données et intégration d’API.
<br><br>
Les étudiants sont amenés à concevoir des architectures logicielles robustes (MVVM, gestion d’état, séparation des responsabilités) et à développer des applications proches de cas d’usage réels.
<br><br>
**Ce portfolio présente une sélection de projets réalisés dans le cadre du cours de développement mobile à la HE-Arc Ingénierie. Il ne reflète pas l’ensemble des activités de la formation.**
'''

